name: Idea or feature request
description: Suggest something that would make Pilot Log better
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: How you fly, train or keep your records today.
