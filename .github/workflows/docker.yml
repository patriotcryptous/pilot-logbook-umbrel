name: Build and publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04   # pinned so runner image changes don't surprise a release
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"   # registry names must be lowercase
      - uses: docker/build-push-action@v7
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64   # umbrelOS runs on both
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/hangar-pilot-logbook:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/hangar-pilot-logbook:latest
