version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hangar-owner-log_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/patriotcryptous/hangar-owner-log:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    environment:
      OWL_DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
