tagline: Your flight log and logbook backup, kept on your own server
description: >-
  A private, single-pilot logbook with a live dashboard, running entirely on your umbrelOS device.


  Import your ForeFlight logbook as a CSV, add flights by hand, and keep photos of your paper logbook pages filed by date. See your totals, 90-day landing currency, flight review and medical reminders, and your progress toward private pilot minimums.


  Track your instructor's endorsements and download a checkride packet. See when your passenger currency runs out, map the airports you've flown to, check the weather against your personal minimums, and track what your flying costs.


  Keep your insurance, certificates, POH, notes, photos and videos in the Document Hangar, with reminders before anything expires. Optional phone alerts (through ntfy) and scheduled backups.


  Export your whole logbook back out as a ForeFlight-format CSV, a printable PDF with page totals, or a full backup zip. No accounts, no cloud, no telemetry: your logbook is a legal record, and it stays yours. The only outbound request is the expiry alert, and only if you turn it on.


  Currency and progress figures are reminders based on what you have logged. They are not a determination of legal currency or certificate eligibility.
