tagline: Your flight log and logbook backup, kept on your own server
description: >-
  Your logbook is a record of every hour you've worked for, and it deserves a backup you control. Pilot Logbook keeps a complete copy on your own umbrelOS device: a safe home for your paper logbook, and your own copy of your ForeFlight logbook, so your records don't live only in someone else's cloud account or subscription.


  Photograph your paper logbook pages and file them by date, so a lost or damaged logbook isn't the end of your records. Import your ForeFlight logbook as a CSV whenever you like (importing again only adds new flights) and export it back out in ForeFlight's own format at any time, so you can always move your data wherever you want.


  On top of that backup is a full single-pilot logbook: a live dashboard with your totals, 90-day landing currency, flight review and medical reminders, and progress toward sport, private, instrument or commercial minimums. Track your instructor's endorsements and download a checkride packet, see when your passenger currency runs out, explore an interactive map of the airports you've flown to, run a Preflight Risk Check (live weather and runway winds against your personal minimums, plus a PAVE risk score and checklists), and track what your flying costs.


  Keep your insurance, certificates, POH, notes, photos and videos in the Document Hangar, with reminders before anything expires. The current FAR and AIM are downloaded into the Hangar on first start and kept up to date. Optional phone alerts (through ntfy) and scheduled backups.


  No accounts, no cloud, no telemetry, and your logbook never leaves your Umbrel. The only outside connections are the map tiles your browser loads on the Airports page, the airport code sent to the NOAA Aviation Weather Center when you run a Preflight Risk Check, a weekly check for new FAR and AIM editions (which you can turn off), and the expiry alerts, if you turn them on.


  Currency, progress, minimums and cost figures are reminders based on what you have logged, not a determination of legal currency or certificate eligibility. Keep your original logbook. Not affiliated with ForeFlight or the FAA.
