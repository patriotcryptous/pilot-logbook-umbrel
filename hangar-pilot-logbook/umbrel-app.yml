releaseNotes: >-
  Personal minimums become the Preflight Risk Check: type an airport code to get the live METAR and TAF, flight category, density altitude, the best runway with headwind and crosswind, and a go/no-go against your minimums. Adds a PAVE risk score that fills itself in from the weather, your logbook and your fuel numbers, sunrise, sunset and night times, preflight checklists and a history of your checks. Your minimums now live on their own page.
