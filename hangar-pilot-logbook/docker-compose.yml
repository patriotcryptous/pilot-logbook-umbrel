version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: hangar-pilot-logbook_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/patriotcryptous/hangar-pilot-logbook:1.2.3
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
